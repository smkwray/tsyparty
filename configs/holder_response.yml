# Metadata-only keys:
version: 1
canonical_frequency: quarterly

shock:
  # qrawatch's public maturity-tilt table exposes ati_baseline_bn as the
  # signed bill-heavy financing object in billions of dollars.
  default_column: ati_baseline_bn
  scale_bn: 100.0

estimation:
  max_horizon_quarters: 4
  min_observations: 8
  covariance: HAC

outcomes:
  transaction_basis: null # Required for transactions; no historical basis is assumed.
  preferred_transaction_columns:
    - transactions
    - treasury_transactions
    - net_transactions
    - net_flow
  fallback_to_holdings_change: true
  panel_units: millions
  report_units: billions

sectors:
  exclude:
    - _discrepancy
  total_sector: _total
  total_matches_holder_perimeter: false # Explicitly attest a same-clock/same-perimeter total before use.
  residual_sector: _residual
  policy_legs:
    - fed

claims:
  label: reduced-form holder-base evidence
  caveat: mechanism evidence for the TDC buyer-mix channel, not a settled causal policy elasticity
